[package]
name = "reims-vgpu-video-nvidia"
description = "The NVIDIA backend: NVDEC and NVENC over the CUDA driver API, loaded at run time, and nothing above them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
reims-vgpu-video-codec = { path = "../reims-vgpu-video-codec" }
reims-vgpu-video-core = { path = "../reims-vgpu-video-core" }
log = "0.4"

[dev-dependencies]
reims-vgpu-video-conformance = { path = "../reims-vgpu-video-conformance" }

# The conformance suite on this backend, named for it: the three backends' examples share one
# target directory, where examples of one name overwrite each other.
[[example]]
name = "nvidia-conformance"
path = "examples/conformance.rs"
