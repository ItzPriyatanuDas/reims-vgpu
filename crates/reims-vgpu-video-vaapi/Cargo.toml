[package]
name = "reims-vgpu-video-vaapi"
description = "The VA-API backend: codecs on the host's GPU through libva, and nothing above it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
log = "0.4"
reims-vgpu-video-codec = { path = "../reims-vgpu-video-codec" }
reims-vgpu-video-core = { path = "../reims-vgpu-video-core" }

[dev-dependencies]
# The suite every backend runs, and its stream readers.
reims-vgpu-video-conformance = { path = "../reims-vgpu-video-conformance" }

# The tests of the bounded waits hold the GPU with a compute shader of their own, on Vulkan
# (`src/va/spin.rs`).
[target.'cfg(target_os = "linux")'.dev-dependencies]
ash.workspace = true

# The conformance suite on this backend, named for it: the three backends' examples share one
# target directory, where examples of one name overwrite each other.
[[example]]
name = "vaapi-conformance"
path = "examples/conformance.rs"
